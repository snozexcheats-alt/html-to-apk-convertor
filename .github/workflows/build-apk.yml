
name: Build HTML to APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: Website URL to convert
        required: true
        type: string
      app_name:
        description: Android app name
        required: true
        default: My Website
        type: string
      package_name:
        description: Android package name
        required: true
        default: com.htmltoapk.app
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android project
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          python3 <<'PY'
          import os, re, json, pathlib, html

          url = os.environ["WEBSITE_URL"].strip()
          name = os.environ["APP_NAME"].strip()
          package = os.environ["PACKAGE_NAME"].strip()

          if not url.startswith(("https://", "http://")):
              raise SystemExit("Website URL must start with https:// or http://")

          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9]*(\.[A-Za-z][A-Za-z0-9]*)+", package):
              raise SystemExit("Invalid package name")

          root = pathlib.Path(".")
          java_dir = root / "app/src/main/java" / package.replace(".", "/")
          java_dir.mkdir(parents=True, exist_ok=True)
          (root / "app/src/main/res/values").mkdir(parents=True, exist_ok=True)

          (root / "settings.gradle").write_text("""
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HTMLToAPK"
          include ':app'
          """.strip() + "\n")

          (root / "build.gradle").write_text("""
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          """.strip() + "\n")

          (root / "app/build.gradle").write_text("""
          plugins {
              id 'com.android.application'
          }

          android {
              namespace System.getenv("PACKAGE_NAME")
              compileSdk 35

              defaultConfig {
                  applicationId System.getenv("PACKAGE_NAME")
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          """.strip() + "\n")

          (root / "app/src/main/res/values/strings.xml").write_text(
              '<resources><string name="app_name">' +
              html.escape(name) +
              '</string></resources>\n'
          )

          (root / "app/src/main/AndroidManifest.xml").write_text("""
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """.strip() + "\n")

          java_source = f'''
          package {package};

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {{
              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl({json.dumps(url)});
              }}
          }}
          '''
          (java_dir / "MainActivity.java").write_text(java_source)
          PY

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: converted-apk
          path: app/build/outputs/apk/debug/app-debug.apk
